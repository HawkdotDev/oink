name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

# Cancel redundant in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality & Type Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Run linter (ESLint)
        run: npm run lint

      - name: Run TypeScript typechecks
        run: npm run typecheck

  build:
    name: Compile & Build Application
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build renderer, main & preload bundles
        run: npm run build

      - name: Verify compiled build artifacts
        run: |
          test -d out/main || (echo "Main build output missing" && exit 1)
          test -d out/preload || (echo "Preload build output missing" && exit 1)
          test -d out/renderer || (echo "Renderer build output missing" && exit 1)
          echo "All bundle targets compiled successfully."

  smoke-packaging:
    name: Smoke Package Test (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools fakeroot dpkg

      - name: Install dependencies
        run: npm ci || npm install

      - name: Unpack package test (no installer overhead)
        run: npm run build:unpack
